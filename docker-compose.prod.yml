name: easyhost

services:
  postgres:
    build: ./infra/postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: easyhost
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: easyhost
      POSTGRES_TLS_MODE: files
      POSTGRES_TLS_CERT_FILE: /etc/npm-letsencrypt/live/${POSTGRES_CERT_NAME:?Set POSTGRES_CERT_NAME in .env}/fullchain.pem
      POSTGRES_TLS_KEY_FILE: /etc/npm-letsencrypt/live/${POSTGRES_CERT_NAME:?Set POSTGRES_CERT_NAME in .env}/privkey.pem
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ${NPM_LETSENCRYPT_DIR:?Set NPM_LETSENCRYPT_DIR in .env}:/etc/npm-letsencrypt:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U easyhost"]
      interval: 5s
      timeout: 5s
      retries: 10

  minio:
    image: pgsty/minio:RELEASE.2026-08-04T00-00-00Z
    restart: unless-stopped
    command: server /data
    environment:
      MINIO_ROOT_USER: easyhost
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?Set MINIO_ROOT_PASSWORD in .env}
      MINIO_API_CORS_ALLOW_ORIGIN: "*"
    volumes:
      - minio_data:/data
    networks:
      default: {}
      proxy:
        aliases:
          - easyhost-minio

  minio-init:
    image: pgsty/mc:RELEASE.2026-09-16T00-00-00Z
    depends_on:
      minio:
        condition: service_started
    entrypoint: >
      /bin/sh -c "
      until mc alias set local http://minio:9000 easyhost $${MINIO_ROOT_PASSWORD}; do echo waiting for minio; sleep 2; done &&
      mc mb --ignore-existing local/easyhost-deploys
      "
    environment:
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?Set MINIO_ROOT_PASSWORD in .env}

  registry-init:
    image: httpd:2.4.62-alpine
    entrypoint: ["/bin/sh", "-c", "htpasswd -Bbn easyhost \"$$REGISTRY_PASSWORD\" > /auth/htpasswd"]
    environment:
      REGISTRY_PASSWORD: ${REGISTRY_PASSWORD:?Set REGISTRY_PASSWORD in .env}
    volumes:
      - registry_auth:/auth
    restart: "no"

  registry:
    image: registry:2.8.3
    restart: unless-stopped
    depends_on:
      registry-init:
        condition: service_completed_successfully
    environment:
      REGISTRY_AUTH: htpasswd
      REGISTRY_AUTH_HTPASSWD_REALM: EasyHost Registry
      REGISTRY_AUTH_HTPASSWD_PATH: /auth/htpasswd
      REGISTRY_STORAGE_DELETE_ENABLED: "true"
    volumes:
      - registry_data:/var/lib/registry
      - registry_auth:/auth:ro
    networks:
      default: {}
      proxy:
        aliases:
          - easyhost-registry

  ai-runtime:
    build: ./server/ai-runtime
    image: easyhost/ai-runtime
    entrypoint: ["true"]
    restart: "no"

  api:
    build:
      context: .
      dockerfile: server/Dockerfile
      args:
        VITE_PUBLIC_API_URL: ${VITE_PUBLIC_API_URL:?Set VITE_PUBLIC_API_URL in .env}
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:48710/api/health').then(response => { if (!response.ok) process.exit(1); }).catch(() => process.exit(1))"]
      interval: 5s
      timeout: 5s
      start_period: 30s
      retries: 30
    depends_on:
      postgres:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully
      ai-runtime:
        condition: service_completed_successfully
      registry:
        condition: service_started
    env_file:
      - .env
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    networks:
      default: {}
      apps: {}
      proxy:
        aliases:
          - easyhost-api

volumes:
  postgres_data:
  minio_data:
  registry_data:
  registry_auth:

networks:
  apps:
    name: easyhost
  proxy:
    name: ${PROXY_NETWORK:?Set PROXY_NETWORK in .env}
    external: true
