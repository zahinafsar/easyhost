name: easyhost

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: easyhost
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: easyhost
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U easyhost"]
      interval: 5s
      timeout: 5s
      retries: 10

  userdb:
    build: ./infra/userdb
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${USERDB_PASSWORD:?Set USERDB_PASSWORD in .env}
      POSTGRES_DB: postgres
      USERDB_TLS_MODE: files
      USERDB_TLS_CERT_FILE: /etc/npm-letsencrypt/live/${USERDB_CERT_NAME:?Set USERDB_CERT_NAME in .env}/fullchain.pem
      USERDB_TLS_KEY_FILE: /etc/npm-letsencrypt/live/${USERDB_CERT_NAME:?Set USERDB_CERT_NAME in .env}/privkey.pem
    ports:
      - "5432:5432"
    volumes:
      - userdb_data:/var/lib/postgresql/data
      - ${NPM_LETSENCRYPT_DIR:?Set NPM_LETSENCRYPT_DIR in .env}:/etc/npm-letsencrypt:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 10

  minio:
    image: pgsty/minio:RELEASE.2026-08-04T00-00-00Z
    restart: unless-stopped
    command: server /data
    environment:
      MINIO_ROOT_USER: easyhost
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?Set MINIO_ROOT_PASSWORD in .env}
      MINIO_API_CORS_ALLOW_ORIGIN: "*"
    volumes:
      - minio_data:/data

  minio-init:
    image: pgsty/mc:RELEASE.2026-09-16T00-00-00Z
    depends_on:
      minio:
        condition: service_started
    entrypoint: >
      /bin/sh -c "
      until mc alias set local http://minio:9000 easyhost $${MINIO_ROOT_PASSWORD}; do echo waiting for minio; sleep 2; done &&
      mc mb --ignore-existing local/easyhost-deploys
      "
    environment:
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?Set MINIO_ROOT_PASSWORD in .env}

  caddy:
    build:
      context: .
      dockerfile: infra/caddy/Dockerfile
      args:
        VITE_PUBLIC_API_URL: ${VITE_PUBLIC_API_URL:?Set VITE_PUBLIC_API_URL in .env}
    restart: unless-stopped
    volumes:
      - caddy_data:/data
      - caddy_config:/config
      - caddy_admin:/run/caddy
    networks:
      default: {}
      apps: {}
      proxy:
        aliases:
          - easyhost-caddy

  api:
    build: ./server
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      userdb:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully
      caddy:
        condition: service_started
    env_file:
      - .env
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - caddy_admin:/run/caddy
    networks:
      - default
      - proxy

volumes:
  postgres_data:
  minio_data:
  userdb_data:
  caddy_data:
  caddy_config:
  caddy_admin:

networks:
  apps:
    name: easyhost
  proxy:
    name: ${PROXY_NETWORK:?Set PROXY_NETWORK in .env}
    external: true
