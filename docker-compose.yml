services:
  postgres:
    image: postgres:16-alpine
    container_name: easyhost-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: easyhost
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: easyhost
    ports:
      - "127.0.0.1:54329:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  userdb:
    build: ./infra/userdb
    container_name: easyhost-userdb
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${USERDB_PASSWORD:?Set USERDB_PASSWORD in .env}
      POSTGRES_DB: postgres
      USERDB_TLS_MODE: self-signed
    ports:
      - "127.0.0.1:54330:5432"
    volumes:
      - userdb_data:/var/lib/postgresql/data

  minio:
    image: pgsty/minio:RELEASE.2026-08-04T00-00-00Z
    container_name: easyhost-minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: easyhost
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?Set MINIO_ROOT_PASSWORD in .env}
      MINIO_API_CORS_ALLOW_ORIGIN: "*"
    ports:
      - "127.0.0.1:19000:9000"
      - "127.0.0.1:19001:9001"
    volumes:
      - minio_data:/data

  minio-init:
    image: pgsty/mc:RELEASE.2026-09-16T00-00-00Z
    container_name: easyhost-minio-init
    depends_on:
      minio:
        condition: service_started
    environment:
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?Set MINIO_ROOT_PASSWORD in .env}
    entrypoint: >
      /bin/sh -c "
      until mc alias set local http://minio:9000 easyhost $${MINIO_ROOT_PASSWORD}; do echo waiting for minio; sleep 2; done &&
      mc mb --ignore-existing local/easyhost-deploys &&
      echo 'minio ready'
      "

volumes:
  postgres_data:
  userdb_data:
  minio_data:
