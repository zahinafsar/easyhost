services:
  postgres:
    image: postgres:16-alpine
    container_name: easyhost-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: easyhost
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: easyhost
    ports:
      - "127.0.0.1:54329:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  minio:
    image: minio/minio:RELEASE.2025-04-22T22-12-26Z
    container_name: easyhost-minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: easyhost
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?Set MINIO_ROOT_PASSWORD in .env}
    ports:
      - "127.0.0.1:19000:9000"
      - "127.0.0.1:19001:9001"
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 5s
      retries: 10

  minio-init:
    image: minio/minio:RELEASE.2025-04-22T22-12-26Z
    container_name: easyhost-minio-init
    depends_on:
      minio:
        condition: service_healthy
    environment:
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?Set MINIO_ROOT_PASSWORD in .env}
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 easyhost $${MINIO_ROOT_PASSWORD} &&
      mc mb --ignore-existing local/easyhost-deploys &&
      echo 'minio ready'
      "

  caddy:
    image: caddy:2-alpine
    container_name: easyhost-caddy
    restart: unless-stopped
    command: caddy run --config /etc/caddy/caddy.json
    ports:
      - "80:80"
      - "443:443"
      - "127.0.0.1:20190:2019"
    volumes:
      - ./infra/caddy/caddy.json:/etc/caddy/caddy.json:ro
      - caddy_data:/data
      - caddy_config:/config
    networks:
      - default
      - easyhost

volumes:
  postgres_data:
  minio_data:
  caddy_data:
  caddy_config:

networks:
  easyhost:
    name: easyhost
